<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="gridGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".05"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".02"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".85"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".85"/></linearGradient><linearGradient id="cardGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#312e81" stop-opacity=".5"/><stop offset="100%" stop-color="#1e1b4b" stop-opacity=".6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="orbGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="60"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.18) translate(20px,-15px);opacity:.65}}@keyframes floatCard1{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatCard2{0%{transform:translateY(0)}50%{transform:translateY(8px)}}@keyframes flowSprint{0%{stroke-dashoffset:240}}@keyframes shimmerPill{0%{opacity:.85;filter:drop-shadow(0 0 2px #38bdf8)}50%{opacity:1;filter:drop-shadow(0 0 8px #818cf8)}}.orb-cyan{animation:pulseOrb 7s ease-in-out infinite;transform-origin:200px 100px}.orb-purple{animation: