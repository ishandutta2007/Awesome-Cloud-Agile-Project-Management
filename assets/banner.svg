<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.02" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(20px, -15px); opacity: 0.65; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes flowSprint {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes shimmerPill {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px #38bdf8); }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #818cf8); }
    }
    .orb-cyan { animation: pulseOrb 7s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-purple { animation: pulseOrb 9s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
    .card-float-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-float-2 { animation: floatCard2 7s ease-in-out infinite; }
    .sprint-line {
      stroke-dasharray: 12, 12;
      animation: flowSprint 8s linear infinite;
    }
    .pill-animated { animation: shimmerPill 4s ease-in-out infinite; }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
  </style>

  <!-- Deep Base Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Agile Grid Pattern -->
  <g opacity="0.15">
    <path d="M0,60 H1200 M0,120 H1200 M0,180 H1200 M0,240 H1200 M0,300 H1200 M0,360 H1200" stroke="#38bdf8" stroke-width="1" />
    <path d="M120,0 V420 M240,0 V420 M360,0 V420 M480,0 V420 M600,0 V420 M720,0 V420 M840,0 V420 M960,0 V420 M1080,0 V420" stroke="#818cf8" stroke-width="1" />
  </g>

  <!-- Dynamic Glowing Ambient Orbs (strictly in background) -->
  <circle class="orb-cyan" cx="220" cy="110" r="140" fill="#0284c7" filter="url(#orbGlow)" />
  <circle class="orb-purple" cx="1020" cy="300" r="160" fill="#7c3aed" filter="url(#orbGlow)" />

  <!-- Animated Dynamic Agile Flow Wireframe (Background Elements) -->
  <g opacity="0.35">
    <path class="sprint-line" d="M 60,360 C 260,340 400,390 600,350 C 800,310 950,380 1140,340" fill="none" stroke="#38bdf8" stroke-width="3" />
    <path class="sprint-line" d="M 80,70 C 300,100 500,40 750,80 C 950,110 1050,50 1120,70" fill="none" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Subtle Dynamic Floating Agile Cards (Left & Right Margins, Non-overlapping) -->
  <g class="card-float-1" opacity="0.75">
    <rect x="50" y="240" width="140" height="70" rx="10" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="70" cy="262" r="5" fill="#38bdf8" />
    <rect x="85" y="259" width="85" height="6" rx="3" fill="#94a3b8" />
    <rect x="70" y="280" width="55" height="14" rx="4" fill="#0369a1" />
    <text x="76" y="291" fill="#bae6fd" font-size="9" font-family="sans-serif" font-weight="600">IN PROGRESS</text>
  </g>

  <g class="card-float-2" opacity="0.75">
    <rect x="1010" y="110" width="140" height="70" rx="10" fill="url(#cardGrad2)" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="1030" cy="132" r="5" fill="#34d399" />
    <rect x="1045" y="129" width="85" height="6" rx="3" fill="#94a3b8" />
    <rect x="1030" y="150" width="45" height="14" rx="4" fill="#065f46" />
    <text x="1038" y="161" fill="#a7f3d0" font-size="9" font-family="sans-serif" font-weight="600">DONE</text>
  </g>

  <!-- FOREGROUND: Main Title and Headers (Never obscured) -->
  <g id="foreground-content">
    <!-- Top Category Tag -->
    <g class="pill-animated">
      <rect x="460" y="55" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="478" cy="69" r="4" fill="#38bdf8" />
      <text x="492" y="73" fill="#38bdf8" font-family="sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text class="title-text" x="600" y="150" text-anchor="middle" font-size="44" fill="url(#titleGrad)" filter="url(#glow)">
      Cloud Agile Project Management
    </text>

    <!-- High-Contrast Subtitle -->
    <text class="subtitle-text" x="600" y="196" text-anchor="middle" font-size="18" fill="#e2e8f0">
      Enterprise SaaS Ecosystems &#8226; Production Self-Hosted Stacks &#8226; Scrum &#38; Kanban
    </text>

    <!-- Secondary Tagline -->
    <text class="subtitle-text" x="600" y="226" text-anchor="middle" font-size="13.5" fill="#94a3b8">
      Jira &#8226; Linear &#8226; Plane &#8226; AppFlowy &#8226; OpenProject &#8226; Focalboard &#8226; Taiga
    </text>

    <!-- Dynamic Interactive Feature Badges / Pills -->
    <g transform="translate(230, 260)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="40" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
        <text x="82" y="25" text-anchor="middle" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600">⚡ Sprint Planning</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(185, 0)">
        <rect width="180" height="40" rx="20" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.95" />
        <text x="90" y="25" text-anchor="middle" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600">📊 Scrum &#38; Kanban</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(385, 0)">
        <rect width="180" height="40" rx="20" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" opacity="0.95" />
        <text x="90" y="25" text-anchor="middle" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600">🛡️ Self-Hosted Stacks</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(585, 0)">
        <rect width="155" height="40" rx="20" fill="#0f172a" stroke="#34d399" stroke-width="1.2" opacity="0.95" />
        <text x="77" y="25" text-anchor="middle" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="600">🤖 AI Automation</text>
      </g>
    </g>

    <!-- Bottom Footer Subtext -->
    <text x="600" y="348" text-anchor="middle" fill="#64748b" font-size="12" font-family="sans-serif" font-weight="500">
      Production-Ready Comparisons &#8226; Verified Tier Limits &#8226; Free &#38; Open Source
    </text>
  </g>
</svg>